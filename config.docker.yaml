http:
  addr: ":8080"
  cors_allowed_origins:
    - "*"

database:
  driver: postgres
  url: "postgres://quote_service:quote_service@db:5432/quote_service?sslmode=disable"

worker:
  interval: 2s
  concurrency: 2

shutdown_timeout: 10s

supported_pairs:
  - USD/EUR
  - EUR/USD
  - USD/MXN
  - EUR/MXN

providers:
  - name: exchangerate
    type: exchangerate
    enabled: true
    priority: 1
    base_url: "http://api.exchangeratesapi.io"
    timeout: 5s
    rate_limit_per_second: 2
    api_key_env: "EXCHANGERATE_KEY"

  - name: frankfurter
    type: frankfurter
    enabled: true
    priority: 2
    base_url: "https://api.frankfurter.dev"
    timeout: 5s
    rate_limit_per_second: 5

  - name: currencyapi
    type: currencyapi
    enabled: true
    priority: 3
    base_url: "https://api.currencyapi.com"
    timeout: 5s
    rate_limit_per_second: 2
    api_key_env: "CURRENCYAPI_KEY"
