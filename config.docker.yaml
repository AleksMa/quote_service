http:
  addr: ":8080"

database:
  driver: postgres
  url: "postgres://quote_service:quote_service@db:5432/quote_service?sslmode=disable"

worker:
  interval: 2s
  concurrency: 2

shutdown_timeout: 10s

supported_pairs:
  - USD/EUR
  - EUR/USD
  - USD/MXN
  - EUR/MXN

providers:
  - name: frankfurter
    type: frankfurter
    enabled: true
    priority: 1
    base_url: "https://api.frankfurter.dev"
    timeout: 5s
    rate_limit_per_second: 5

  - name: exchangerate
    type: exchangerate
    enabled: false  # add api key before enabling
    priority: 2
    base_url: "http://api.exchangeratesapi.io"
    timeout: 5s
    rate_limit_per_second: 2
    api_key_env: "EXCHANGERATE_KEY"
